services:
  db:
    image: pgvector/pgvector:pg17
    container_name: reco_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reco
    ports:
      - "5433:5432"
    volumes:
      - reco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reco"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  reco_pgdata:
